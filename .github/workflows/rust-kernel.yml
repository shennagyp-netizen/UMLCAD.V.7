name: Rust kernel validation

on:
  push:
    branches:
      - main
      - "milestone/**"
  pull_request:

jobs:
  rust-kernel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Repair verified Rust baseline blockers
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/repair_baseline.py
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kernel/math kernel/native/src/lib.rs
          git commit -m "ci: repair verified Rust baseline blockers"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
      - name: Run Rust kernel test suite
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path kernel/native/Cargo.toml 2>&1 | tee cargo-test.log
      - name: Upload Rust test log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-kernel-test-log
          path: cargo-test.log
          if-no-files-found: error
