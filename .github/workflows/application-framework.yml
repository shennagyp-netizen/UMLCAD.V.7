name: Application framework validation

on:
  push:
    branches:
      - main
      - "milestone/**"
  pull_request:

jobs:
  application-framework:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run Application Layer architecture gate
        run: python3 app_e2e/run.py
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"
      - name: Build application framework
        run: dotnet build app/framework/UMLCAD.ApplicationLayer.sln --configuration Release
      - name: Run application framework tests
        run: dotnet test app/framework/UMLCAD.ApplicationLayer.sln --configuration Release --no-build
