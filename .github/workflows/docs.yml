name: Documentation validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra

      - name: Build handbook
        working-directory: docs
        run: |
          set +e
          latexmk -pdf -interaction=nonstopmode -halt-on-error doc.tex 2>&1 | tee latex-build.log
          rc=${PIPESTATUS[0]}
          echo "latexmk_exit=$rc" >> latex-build.log
          exit $rc

      - name: Verify PDF
        working-directory: docs
        if: success()
        run: |
          test -s doc.pdf
          pdfinfo doc.pdf | grep '^Pages:'

      - name: Upload LaTeX diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umlcad-doc-latex-diagnostics
          path: |
            docs/doc.tex
            docs/doc.log
            docs/latex-build.log
            docs/doc.fls
            docs/doc.fdb_latexmk
          if-no-files-found: warn
